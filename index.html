<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Comparte - Lista de Compras</title>
    <meta name="description" content="Una aplicación para compartir listas de supermercado con amigos en tiempo real.">
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Iconos (Phosphor Icons) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Modal de Bienvenida (Login) -->
    <div id="login-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-icon">
                <i class="ph ph-hand-waving"></i>
            </div>
            <h2>¡Hola! ¿Cómo te llamas?</h2>
            <p>Tus amigos verán los productos que añadas a la lista.</p>
            <form id="login-form">
                <input type="text" id="username-input" placeholder="Escribe tu nombre..." required autocomplete="off">
                <button type="submit" class="btn-primary">Entrar a la Lista</button>
            </form>
        </div>
    </div>

    <main class="app-container">
        <header class="app-header">
            <div class="header-title">
                <i class="ph ph-shopping-cart"></i>
                <h1>Super Comparte</h1>
            </div>
            <div class="header-actions">
                <button id="logs-btn" class="btn-icon" aria-label="Ver actividad">
                    <i class="ph ph-bell"></i>
                    <span id="logs-badge" class="badge-dot hidden"></span>
                </button>
                <button id="share-btn" class="btn-share" aria-label="Compartir lista">
                    <i class="ph ph-share-network"></i>
                    <span class="desktop-only">Compartir</span>
                </button>
            </div>
        </header>

        <section class="add-item-section">
            <form id="add-item-form" class="add-item-form">
                <div class="input-group">
                    <input type="text" id="item-input" placeholder="Ej: Manzanas, Leche..." required autocomplete="off">
                    <button type="submit" class="btn-add" aria-label="Añadir producto">
                        <i class="ph ph-plus"></i>
                    </button>
                </div>
            </form>
        </section>

        <section class="shopping-list-section">
            <div class="list-header">
                <h2>Tu carrito</h2>
                <span id="items-count" class="badge">0</span>
            </div>
            
            <ul id="shopping-list" class="shopping-list">
                <!-- Los items se renderizarán aquí vía JS -->
            </ul>
            
            <div id="empty-state" class="empty-state hidden">
                <i class="ph ph-basket"></i>
                <p>La lista está vacía. ¡Añade algunos productos!</p>
            </div>
        </section>
        
        <div id="toast" class="toast hidden">
            <!-- Mensajes de feedback -->
        </div>

        <!-- Panel de Actividad (Logs) -->
        <div id="logs-panel" class="logs-panel hidden">
            <div class="logs-header">
                <h3>Actividad Reciente</h3>
                <button id="close-logs-btn" class="btn-icon" aria-label="Cerrar panel">
                    <i class="ph ph-x"></i>
                </button>
            </div>
            <ul id="logs-list" class="logs-list">
                <!-- Los logs se renderizarán aquí -->
            </ul>
        </div>
        
    </main>

    <script src="app.js"></script>
</body>
</html>
